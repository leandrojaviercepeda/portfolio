# openspec/config.yaml
schema: spec-driven

context: |
  Portfolio personal profesional con Next.js 14, React 18, TypeScript, Tailwind CSS y Framer Motion.
  Incluye temas claro/oscuro, i18n (es/en/pt), y todas las secciones estándar 2026.

strict_tdd: false

rules:
  proposal:
    - Incluir plan de rollback para cambios arriesgados
    - Identificar módulos/paquetes afectados
  specs:
    - Usar formato Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con rationale
  tasks:
    - Agrupar tareas por fase (infraestructura, implementación, testing)
    - Usar numeración jerárquica (1.1, 1.2, etc.)
    - Mantener tareas pequeñas para completar en una sesión
  apply:
    - Seguir patrones de código existentes y convenciones
    - Cargar skills relevantes para el stack del proyecto
  verify:
    - Ejecutar tests si existe infraestructura de testing
    - Comparar implementación contra cada escenario de spec

testing:
  test_runner: null
  strict_tdd: false
  unit: false
  integration: false
  e2e: false
  coverage: false
